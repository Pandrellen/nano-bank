apiVersion: apps/v1
kind: Deployment
metadata:
  name: nano-bank-ui
  namespace: nano-bank
  labels: { app: nano-bank-ui }
spec:
  replicas: 1
  selector:
    matchLabels: { app: nano-bank-ui }
  template:
    metadata:
      labels: { app: nano-bank-ui }
    spec:
      containers:
      - name: nano-bank-ui
        image: nano-bank-ui:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet: { path: /, port: 3000 }
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nano-bank-ui
  namespace: nano-bank
spec:
  type: NodePort
  selector: { app: nano-bank-ui }
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30300
